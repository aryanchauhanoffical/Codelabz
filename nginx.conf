# Codelabz — Nginx configuration for serving the React SPA
#
# This file is placed at /etc/nginx/conf.d/app.conf inside the container.
# The base nginx.conf already wraps conf.d/*.conf inside an http {} block,
# so every directive here lives at server scope unless noted otherwise.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    # gzip is switched on at the http level in the default nginx.conf.
    # We tune the level and add the types we actually serve.
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── index.html — never cache ───────────────────────────────────────────────
    # The browser must always fetch a fresh copy so it picks up the latest
    # content-hash filenames that Vite embeds on every build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
    }

    # ── Hashed static assets — cache forever ──────────────────────────────────
    # Vite appends a content hash to every JS, CSS, font and image filename
    # (e.g. main.4a3b2c1d.js). If the file changes, the hash changes, so the
    # old cached file is never stale. Cache for 1 year and mark as immutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        expires    365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles navigation client-side. Any URL that does not match
    # a real file must return index.html so the app can boot and render the
    # correct route. Without this, a hard refresh on /tutorial/xyz returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
